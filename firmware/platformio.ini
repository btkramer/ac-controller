; ac-controller firmware: Sunton ESP32-4848S040, LVGL UI -> Home Assistant REST.
; Pin map / display notes: ../HARDWARE.md. Credentials: ../secrets.h (gitignored).
[env:usb]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude
  -I${PROJECT_DIR}/..
lib_deps =
  moononournation/GFX Library for Arduino@1.6.0
  lvgl/lvgl@9.2.2
  bblanchon/ArduinoJson@7.2.0
monitor_speed = 115200
upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0

; Wireless: `pio run -e ota -t upload` (HTTP POST /update). AC_HOST=<ip> overrides the default 192.168.1.197.
; First flash of a board (or if OTA is broken) must use env:usb.
[env:ota]
extends = env:usb
upload_protocol = custom
extra_scripts = post:ota_upload.py
